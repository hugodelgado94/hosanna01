<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa · Hosanna in Excelsis Academia</title>
<meta name="description" content="Mapas mentales de teología católica, organizados por temas, comenzando por el tomismo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#050a1c;--navy:#0a1330;--cgold:#d9b25f;--cgold-l:#f3dc9c;--ivory:#efe8d6;--mute:#a9b0c8;--paper:#faf8f3;--ink:#14182b;--ink-soft:#4a4f66;--gold:#a8812c;--line:rgba(20,24,43,.14);--display:'Cinzel',Georgia,serif;--serif:'Cormorant Garamond',serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper)}
a{color:inherit}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;z-index:2}
nav a{font-family:var(--display);letter-spacing:.18em;font-size:13px;color:var(--ivory);text-decoration:none}
.hero{position:relative;min-height:72vh;display:grid;place-items:center;text-align:center;color:var(--ivory);overflow:hidden;
background:radial-gradient(ellipse at 50% 40%,#16224d 0%,var(--navy) 40%,var(--night) 80%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:120px 6vw 80px;max-width:860px}
.kicker{font-family:var(--display);letter-spacing:.35em;font-size:12px;color:var(--cgold)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,84px);letter-spacing:.08em;margin:.3em 0 .2em;color:var(--cgold-l)}
.latin{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,28px);color:var(--ivory)}
.tr{font-family:var(--serif);color:var(--mute);font-size:18px;margin-top:6px}
.curve{display:block;width:100%;height:80px;margin-top:-79px;position:relative}
main{max-width:1160px;margin:0 auto;padding:40px 5vw 100px}
.sec h2{font-family:var(--display);font-weight:400;letter-spacing:.12em;font-size:clamp(26px,3.4vw,40px);margin:0}
.sec .lead{font-family:var(--serif);font-size:21px;color:var(--ink-soft);max-width:62ch}
.rule{width:80px;height:1px;background:var(--gold);margin:14px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:34px;margin-top:36px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 50px -24px rgba(10,19,48,.35)}
.card .img{display:block;aspect-ratio:4/3;background:var(--night);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}
.card:hover img{transform:scale(1.04)}
.badge{position:absolute;bottom:12px;left:12px;font-family:var(--display);font-size:11px;letter-spacing:.2em;background:rgba(5,10,28,.75);color:var(--cgold-l);padding:7px 12px;border:1px solid rgba(217,178,95,.5)}
.body{padding:26px 28px 30px}
.body h3{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;margin:0 0 4px}
.place{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.body p{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--ink-soft)}
.btn{display:inline-block;margin-top:6px;font-family:var(--display);font-size:12px;letter-spacing:.2em;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--gold);padding-bottom:4px}
.soon{margin-top:70px;padding:28px;border:1px dashed var(--line);font-family:var(--serif);font-size:19px;color:var(--ink-soft);text-align:center}
footer{background:var(--night);color:var(--mute);text-align:center;padding:40px 5vw;font-size:13px}
footer a{color:var(--cgold);text-decoration:none;margin:0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.intro{display:grid;grid-template-columns:1fr 1.6fr;gap:48px;align-items:start;margin:10px 0 60px}
.intro .q{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3vw,36px);line-height:1.3;color:var(--ink);border-left:1px solid var(--gold);padding-left:24px}
.intro .q small{display:block;font-style:normal;font-family:var(--display);font-size:11px;letter-spacing:.25em;color:var(--gold);margin-top:14px}
.intro p{font-family:var(--serif);font-size:21px;line-height:1.7;color:var(--ink-soft);margin:0 0 16px}
.intro p:first-child::first-letter{float:left;font-family:var(--display);font-size:64px;line-height:.9;color:var(--gold);padding:6px 10px 0 0}
.card .img::after{content:"⤢";position:absolute;top:12px;right:14px;color:var(--cgold-l);font-size:22px;text-shadow:0 2px 8px #000}
.btn{background:var(--night);color:var(--cgold-l)!important;border:1px solid var(--gold);padding:12px 20px!important}
.btn:hover{background:var(--navy)}
@media(max-width:800px){.intro{grid-template-columns:1fr}}

body{background:var(--night);color:var(--ivory);height:100vh;display:flex;flex-direction:column;margin:0}
.top{display:flex;gap:18px;align-items:center;padding:16px 4vw;border-bottom:1px solid rgba(217,178,95,.3)}.top a{color:var(--cgold);text-decoration:none;font-family:var(--display);letter-spacing:.15em;font-size:13px}
.top h1{font-size:22px;margin:0;color:var(--cgold-l)}#v{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}#v img{position:absolute;left:50%;top:50%;max-width:96vw;max-height:calc(100vh - 80px);transform-origin:center}
.wait{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:22px;color:var(--mute);padding:20px}#vb{margin-left:auto;font-family:var(--display);font-size:12px;letter-spacing:.2em;background:transparent;color:var(--cgold-l);border:1px solid var(--cgold);padding:9px 16px;cursor:pointer}
#vp{display:none;position:fixed;right:2vw;bottom:2vw;width:min(520px,94vw);background:var(--night);border:1px solid var(--cgold);padding:8px;z-index:5;box-shadow:0 20px 60px #000}
#vp.on{display:block}#vp .r{position:relative;aspect-ratio:16/9}#vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head><body>
<div class="top"><a href="mapas-mentales.html">← MAPAS</a><h1 id="t"></h1><button id="vb" hidden>VER EXPLICACIÓN</button></div><div id="vp"><div class="r"></div></div><div id="v"></div>
<script>
const M={"1": {"t": "Las cuatro causas de Aristóteles (y la justificación)", "d": "Material, formal, eficiente y final, y cómo la causa formal explica la diferencia en la justificación.", "img": "mapas/001.webp", "video": ""}};const id=new URLSearchParams(location.search).get('id');let k=String(parseInt(id,10));if(!M[k]){k='1';if(id!==null)history.replaceState(null,'','?id=1')}const m=M[k];const v=document.getElementById('v');
document.getElementById('t').textContent=m?m.t:'Mapa no encontrado';if(m)document.title=m.t+' · Mapas mentales';
if(!m||!m.img){v.outerHTML='<div class="wait"><div>'+(m?m.d:'')+'<br><br><span style="font-family:Cinzel;letter-spacing:.2em;font-size:13px;color:#d9b25f">MAPA EN PREPARACIÓN</span></div></div>'}
else{const i=new Image();i.src=m.img;i.alt=m.t;v.appendChild(i);let s=1,x=0,y=0,d=null;const a=()=>i.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`;a();
v.onwheel=e=>{e.preventDefault();s=Math.min(8,Math.max(1,s*(e.deltaY<0?1.15:.87)));a()};v.onpointerdown=e=>{d=[e.clientX-x,e.clientY-y];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(d){x=e.clientX-d[0];y=e.clientY-d[1];a()}};v.onpointerup=()=>d=null;v.ondblclick=()=>{s=1;x=y=0;a()}}

if(m&&m.video){const b=document.getElementById('vb'),p=document.getElementById('vp');b.hidden=false;b.onclick=()=>{if(!p.querySelector('iframe'))p.firstChild.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(m.video)+'" title="Explicación del mapa" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';p.classList.toggle('on');b.textContent=p.classList.contains('on')?'CERRAR VIDEO':'VER EXPLICACIÓN'}}
</script></body></html>
